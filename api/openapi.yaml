openapi: 3.0.3
info:
  title: ARUS API
  description: Backend REST API untuk Sistem Pendukung Keputusan Bisnis Multi-Outlet ARUS
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Memeriksa ketersediaan server dan database
      responses:
        '200':
          description: Server berjalan normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string

  /auth/login:
    post:
      summary: Login pengguna
      description: Verifikasi kredensial email dan password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login berhasil
        '401':
          description: Email atau password salah
        '423':
          description: Akun dikunci sementara (5x gagal)

  /auth/refresh:
    post:
      summary: Perbarui JWT Access Token
      description: Menukar refresh token lama dengan pasangan token baru (Token Rotation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token berhasil diperbarui
        '401':
          description: Refresh token tidak valid atau terdeteksi reuse

  /auth/logout:
    post:
      summary: Logout pengguna
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logout berhasil

  /auth/me:
    get:
      summary: Profil pengguna aktif
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data profil dan outlet pengguna
    patch:
      summary: Perbarui nama profil
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil berhasil diperbarui

  /auth/change-password:
    post:
      summary: Ubah password pengguna
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Password berhasil diubah

  /users:
    get:
      summary: Daftar pengguna (Owner only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List pengguna terdaftar
    post:
      summary: Tambah pengguna baru (Owner only)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Pengguna berhasil dibuat

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          example: connected
        time:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Endpoint tidak ditemukan.
            request_id:
              type: string
              example: c1b9e072-87ad-4522-83fb-628e8fef4e57
